name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Linux
          - os: windows-latest
            artifact_name: Windows
          - os: macos-latest
            artifact_name: macOS

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Install dependencies on Linux (required for JUCE/ALSA/OpenGL)
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libX11-dev libXrandr-dev libXinerama-dev libXcursor-dev libfreetype6-dev libudev-dev libgl1-mesa-dev libwebkit2gtk-4.0-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    # Find and upload artifacts depending on the OS
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Chroma-Pulse-${{ matrix.artifact_name }}
        path: |
          build/**/*.vst3
          build/**/*.app
          build/**/*.exe
          
